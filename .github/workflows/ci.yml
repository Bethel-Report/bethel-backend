name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install commitlint
        run: yarn install --frozen-lockfile

      - name: Validate last commit message
        run: yarn commitlint --last --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache MinIO Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: minio-${{ hashFiles('docker/minio/Dockerfile') }}
          restore-keys: minio-

      - name: Build MinIO image
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          load: true
          tags: bethel-minio:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Build and verify
        run: ./mvnw verify --batch-mode --no-transfer-progress -Dminio.test.image=bethel-minio:test
