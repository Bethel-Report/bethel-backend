spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=${DATASOURCE_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATASOURCE_POOL_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${DATASOURCE_CONNECTION_MAX_LIFETIME_MS:1800000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVICE_URL}

storage.minio.endpoint=${MINIO_ENDPOINT}
storage.minio.access-key=${MINIO_ACCESS_KEY}
storage.minio.secret-key=${MINIO_SECRET_KEY}
storage.minio.bucket=${MINIO_BUCKET:bethel-report}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=10000

app.messaging.email.exchange=${RABBITMQ_EMAIL_EXCHANGE:email.exchange}
app.messaging.email.routing-key=${RABBITMQ_EMAIL_ROUTING_KEY:email.send}
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@bethelreport.local}

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
