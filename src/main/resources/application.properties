spring.application.name=Backend

spring.profiles.active=dev

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/master}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVICE_URL:http://localhost:8081/realms/master/protocol/openid-connect/certs}


storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:}
storage.minio.secret-key=${MINIO_SECRET_KEY:}
storage.minio.bucket=${MINIO_BUCKET:bethel-report}

storage.upload.allowed-extensions=${PUBLICATION_ALLOWED_EXTENSIONS:pdf,jpg,jpeg,png,webp,mp4,webm,docx,xlsx,pptx}
storage.upload.max-size=${PUBLICATION_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${PUBLICATION_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${PUBLICATION_MAX_REQUEST_SIZE:11MB}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

app.messaging.email.exchange=${RABBITMQ_EMAIL_EXCHANGE:email.exchange}
app.messaging.email.routing-key=${RABBITMQ_EMAIL_ROUTING_KEY:email.send}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=10000

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
