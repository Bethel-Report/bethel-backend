services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    container_name: backend

    environment:
      MINIO_ENDPOINT: http://minio:9000
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@bethelreport.local}
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/bethel-report
      KEYCLOAK_SERVICE_URL: http://keycloak:8080/realms/bethel-report/protocol/openid-connect/certs
      FRONTEND_CLIENT_ID: ${FRONTEND_CLIENT_ID:-bethel-report-frontend}
      INVITATION_REDIRECT_URL: ${INVITATION_REDIRECT_URL:-http://localhost:3000/admission/complete}
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: bethel-report
      KEYCLOAK_ADMIN_CLIENT_ID: bethel-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_EMAIL_EXCHANGE: ${RABBITMQ_EMAIL_EXCHANGE:-email.exchange}
      RABBITMQ_EMAIL_ROUTING_KEY: ${RABBITMQ_EMAIL_ROUTING_KEY:-email.send}

    ports:
      - "8080:8080"

    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - net1

  postgres:
    image: postgres:16

    env_file:
      - .env

    container_name: backend-postgres

    environment:
      POSTGRES_DB: ${DATASOURCE_DB}
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATASOURCE_USERNAME} -d ${DATASOURCE_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - net1

  keycloak-init:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    entrypoint: ["/bin/bash", "/opt/keycloak/bootstrap.sh"]
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@bethelreport.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-BethelLocal-2026!}
      FRONTEND_CLIENT_ID: ${FRONTEND_CLIENT_ID:-bethel-report-frontend}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INVITATION_REDIRECT_URL: ${INVITATION_REDIRECT_URL:-http://localhost:3000/admission/complete}
      KEYCLOAK_EMAIL_FROM: ${KEYCLOAK_EMAIL_FROM:-noreply@bethelreport.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    networks:
      - net1

  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    container_name: backend-keycloak
    command:
      - start
      - --optimized
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_JAVA_HEAP:--Xms128m -Xmx512m}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in backend/.env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in backend/.env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_EMAIL_EXCHANGE: ${RABBITMQ_EMAIL_EXCHANGE:-email.exchange}
      RABBITMQ_EMAIL_ROUTING_KEY: ${RABBITMQ_EMAIL_ROUTING_KEY:-email.send}
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm:/opt/keycloak/data/import
      - ./keycloak/export:/opt/keycloak/data/export
    networks:
      - net1

  minio:
    image: bethel-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net1

volumes:
  minio_data:
  postgres_data:
  keycloak_data:

networks:
  net1:
    external: true
